apiVersion: apps/v1
kind: Deployment
metadata:
  name: vikunja
spec:
  replicas: 1
  strategy: {type: Recreate}
  selector:
    matchLabels: {app: vikunja}
  template:
    metadata:
      labels: {app: vikunja}
    spec:
      enableServiceLinks: false
      securityContext:
        runAsUser: 1000             # the image's USER
        runAsGroup: 1000
        runAsNonRoot: true
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: vikunja
          image: vikunja/vikunja:2.8.0@sha256:35d937baf3b5d5803bed6b9e11d007448b7b536df9e4346dc35551e1072636c3
          env:
            - {name: VIKUNJA_DATABASE_PATH, value: /data/vikunja.db}
            - {name: VIKUNJA_FILES_BASEPATH, value: /data/files}
            - {name: VIKUNJA_SERVICE_TIMEZONE, value: Asia/Ho_Chi_Minh}
            # Turn on briefly to add a user, then off again.
            - {name: VIKUNJA_SERVICE_ENABLEREGISTRATION, value: "false"}
            # Required while CORS is on (the default).
            - {name: VIKUNJA_SERVICE_PUBLICURL, value: "https://vikunja.home.dedyoc.com/"}
            # Signs login tokens. Without it every restart logs you out. The Secret is created
            # by hand, never committed; optional, so the pod still starts without it.
            - name: VIKUNJA_SERVICE_SECRET
              valueFrom:
                secretKeyRef: {name: vikunja-secret, key: secret, optional: true}
          ports: [{name: http, containerPort: 3456}]
          readinessProbe:
            httpGet: {path: /api/v1/info, port: http}
            periodSeconds: 15
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
          volumeMounts:
            - {name: data, mountPath: /data}
          resources:
            requests: {cpu: 10m, memory: 64Mi}
            limits: {memory: 256Mi}
      volumes:
        - name: data
          persistentVolumeClaim: {claimName: vikunja-data}
