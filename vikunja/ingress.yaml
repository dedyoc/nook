# https://vikunja.home.dedyoc.com/ (homelab ADR-046). No tls: block needed: K3s' websecure
# entrypoint has TLS on, and Traefik's default TLSStore serves the *.home.dedyoc.com wildcard.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: vikunja
spec:
  ingressClassName: traefik
  rules:
    - host: vikunja.home.dedyoc.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: vikunja
                port: {name: http}
