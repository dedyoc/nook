apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: vikunja
spec:
  ingressClassName: traefik
  rules:
    - host: vikunja.home.dedyoc.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: vikunja
                port: {name: http}
