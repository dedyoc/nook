# Every app in the nook namespace. How this repo fits together: README.md.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: nook
resources:
  - memos/
  - glance/
  - actual/
  - uptime-kuma/
  - ntfy/
  - freshrss/
  - linkding/
  - vikunja/
  - it-tools/
  - excalidraw/
configMapGenerator:
  - name: sqlite-snapshot   # used by every <app>-snapshot CronJob except Memos'
    files: [_snapshot/snapshot.py]
