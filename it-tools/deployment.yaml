# nginx starts as root and drops to its own user, so instead of runAsUser the container
# keeps only the capabilities it needs.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: it-tools
spec:
  replicas: 1
  selector:
    matchLabels: {app: it-tools}
  template:
    metadata:
      labels: {app: it-tools}
    spec:
      enableServiceLinks: false
      securityContext:
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: it-tools
          image: corentinth/it-tools:2024.10.22-7ca5933@sha256:8b8128748339583ca951af03dfe02a9a4d7363f61a216226fc28030731a5a61f
          env:
            # Size nginx workers from the CPU limit (1) instead of the host's 16 cores.
            - {name: NGINX_ENTRYPOINT_WORKER_PROCESSES_AUTOTUNE, value: "1"}
          ports: [{name: http, containerPort: 80}]
          readinessProbe:
            httpGet: {path: /, port: http}
            periodSeconds: 30
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
              add: [CHOWN, SETUID, SETGID, NET_BIND_SERVICE]
          resources:
            requests: {cpu: 5m, memory: 16Mi}
            limits: {cpu: 500m, memory: 64Mi}   # the CPU limit is only there to size nginx
