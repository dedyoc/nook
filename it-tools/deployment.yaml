# IT-Tools: browser-side developer utilities (JSON/YAML, cron, JWT, base64...) (homelab ADR-045). Static files served by the image's nginx; no state, no volume.
# nginx's master starts as root and drops to 'nginx': root is kept to the capabilities it needs.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: it-tools
spec:
  replicas: 1
  selector:
    matchLabels: {app: it-tools}
  template:
    metadata:
      labels: {app: it-tools}
    spec:
      enableServiceLinks: false
      securityContext:
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: it-tools
          image: corentinth/it-tools:2024.10.22-7ca5933@sha256:8b8128748339583ca951af03dfe02a9a4d7363f61a216226fc28030731a5a61f
          env:
            # The image's 30-tune-worker-processes.sh sets worker_processes from the CPU limit
            # below (1), instead of "auto" = 16 workers on node0.
            - {name: NGINX_ENTRYPOINT_WORKER_PROCESSES_AUTOTUNE, value: "1"}
          ports: [{name: http, containerPort: 80}]
          readinessProbe:
            httpGet: {path: /, port: http}
            periodSeconds: 30
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
              add: [CHOWN, SETUID, SETGID, NET_BIND_SERVICE]   # tested locally 2026-11-22
          resources:   # ~9Mi with one worker (docker stats, 2026-11-22)
            requests: {cpu: 5m, memory: 16Mi}
            limits: {cpu: 500m, memory: 64Mi}   # the CPU limit exists only to size nginx
