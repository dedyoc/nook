apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: it-tools
spec:
  ingressClassName: traefik
  rules:
    - host: it-tools.home.dedyoc.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: it-tools
                port: {name: http}
