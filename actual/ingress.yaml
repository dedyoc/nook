apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: actual
spec:
  ingressClassName: traefik
  rules:
    - host: actual.home.dedyoc.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: actual
                port: {name: http}
