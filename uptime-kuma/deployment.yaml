# Uptime Kuma: checks every nook app from inside the cluster and pushes alerts to ntfy
# (homelab ADR-045). First visit: pick SQLite, then create the admin account.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: uptime-kuma
spec:
  replicas: 1
  strategy: {type: Recreate}
  selector:
    matchLabels: {app: uptime-kuma}
  template:
    metadata:
      labels: {app: uptime-kuma}
    spec:
      enableServiceLinks: false
      securityContext:
        runAsUser: 1000             # 'node' in the -rootless image
        runAsGroup: 1000
        runAsNonRoot: true
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: uptime-kuma
          # -slim: no bundled MariaDB/Chromium; -rootless: USER node.
          image: louislam/uptime-kuma:2.5.12-slim-rootless@sha256:212d2131952eded9b2508620455f15f5c2c85c262aafd23b97a7447c53e1d1bc
          ports: [{name: http, containerPort: 3001}]
          readinessProbe:
            httpGet: {path: /, port: http}   # 302 to /dashboard or /setup: counts as ready
            periodSeconds: 15
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: {drop: [ALL]}
          volumeMounts:
            - {name: data, mountPath: /app/data}
          resources:   # ~110Mi idle, no monitors (docker stats, 2026-11-22)
            requests: {cpu: 10m, memory: 128Mi}
            limits: {memory: 384Mi}
      volumes:
        - name: data
          persistentVolumeClaim: {claimName: uptime-kuma-data}
