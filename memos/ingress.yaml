# memos/ingress.yaml
# No host rule: Memos owns / on every name that reaches Traefik (homelab ADR-037).
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: memos
spec:
  ingressClassName: traefik
  rules:
    - http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: memos
                port: {name: http}
