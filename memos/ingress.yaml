# https://memos.home.dedyoc.com/ (homelab ADR-046). Until 2026-11-24 Memos had no host rule and
# owned / (ADR-037); / now belongs to Glance.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: memos
spec:
  ingressClassName: traefik
  rules:
    - host: memos.home.dedyoc.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: memos
                port: {name: http}
