apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: memos-data
  annotations:
    argocd.argoproj.io/sync-options: Prune=false
spec:
  storageClassName: local-path
  accessModes: [ReadWriteOnce]   # still fine for Memos and its snapshot Job: same node
  resources:
    requests: {storage: 2Gi}
