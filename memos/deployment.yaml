apiVersion: apps/v1
kind: Deployment
metadata:
  name: memos
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels: {app: memos}
  template:
    metadata:
      labels: {app: memos}
    spec:
      enableServiceLinks: false
      securityContext:
        # Starting as 10001 skips the entrypoint's chown step, which needs root.
        # local-path creates the volume directory as 0777, so 10001 can still write to it.
        runAsUser: 10001
        runAsGroup: 10001
        runAsNonRoot: true
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: memos
          image: neosmemo/memos:0.31.0@sha256:24c2707ddd8fbd2ceaa7a61ecab86a53cdcde640b24ce572b73da14b00b5785f
          ports: [{name: http, containerPort: 5230}]
          readinessProbe:
            httpGet: {path: /healthz, port: http}
            periodSeconds: 10
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: {drop: [ALL]}
          volumeMounts:
            - {name: data, mountPath: /var/opt/memos}
          resources:
            requests: {cpu: 10m, memory: 64Mi}
            limits: {memory: 256Mi}
      volumes:
        - name: data
          persistentVolumeClaim: {claimName: memos-data}
