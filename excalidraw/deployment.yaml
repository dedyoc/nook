# nginx starts as root and drops to its own user, so instead of runAsUser the container
# keeps only the capabilities it needs.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: excalidraw
spec:
  replicas: 1
  selector:
    matchLabels: {app: excalidraw}
  template:
    metadata:
      labels: {app: excalidraw}
    spec:
      enableServiceLinks: false
      securityContext:
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: excalidraw
          # Upstream only publishes :latest, so the digest is the real pin.
          image: excalidraw/excalidraw:latest@sha256:f7ee194addd607bf831d2af0f0a34463dd4225e426cf35199ef0b12a803398e9
          env:
            # Size nginx workers from the CPU limit (1) instead of the host's 16 cores.
            - {name: NGINX_ENTRYPOINT_WORKER_PROCESSES_AUTOTUNE, value: "1"}
          ports: [{name: http, containerPort: 80}]
          readinessProbe:
            httpGet: {path: /, port: http}
            periodSeconds: 30
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
              add: [CHOWN, SETUID, SETGID, NET_BIND_SERVICE]
          resources:
            requests: {cpu: 5m, memory: 16Mi}
            limits: {cpu: 500m, memory: 64Mi}   # the CPU limit is only there to size nginx
