# bootstrap.sh runs migrations and chowns data/ as root, then uwsgi drops to www-data (82).
# So no runAsUser; capabilities are cut instead.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: linkding
spec:
  replicas: 1
  strategy: {type: Recreate}
  selector:
    matchLabels: {app: linkding}
  template:
    metadata:
      labels: {app: linkding}
    spec:
      enableServiceLinks: false
      securityContext:
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: linkding
          image: sissbruecker/linkding:1.47.0-alpine@sha256:04e67acd04f1f1b3edd1bdd36fcf0dd5efaf8cdd99444e14be92c608575fa87a
          env:
            # Without this, Django rejects logins over HTTPS as a CSRF failure.
            - {name: LD_CSRF_TRUSTED_ORIGINS, value: "https://linkding.home.dedyoc.com"}
          ports: [{name: http, containerPort: 9090}]
          readinessProbe:
            httpGet: {path: /health, port: http}
            periodSeconds: 15
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
              add: [CHOWN, SETUID, SETGID, FOWNER, DAC_OVERRIDE]
          volumeMounts:
            - {name: data, mountPath: /etc/linkding/data}
          resources:   # 4 uwsgi workers plus a task runner, hence the larger request
            requests: {cpu: 10m, memory: 160Mi}
            limits: {memory: 384Mi}
      volumes:
        - name: data
          persistentVolumeClaim: {claimName: linkding-data}
