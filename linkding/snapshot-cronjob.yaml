# Nightly consistent copy of linkding's SQLite databases into .snapshots/ on its own volume,
# before restic's 03:00 run (homelab ADR-045). Script: _snapshot/snapshot.py (ConfigMap).
# Runs as 82:82: www-data, which uwsgi drops to and bootstrap.sh chowns data/ to.
apiVersion: batch/v1
kind: CronJob
metadata:
  name: linkding-snapshot
spec:
  schedule: "41 2 * * *"
  timeZone: Asia/Ho_Chi_Minh
  concurrencyPolicy: Forbid
  startingDeadlineSeconds: 3600
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 1
      activeDeadlineSeconds: 300
      template:
        spec:
          restartPolicy: Never
          enableServiceLinks: false
          securityContext:
            runAsUser: 82
            runAsGroup: 82
            runAsNonRoot: true
            seccompProfile: {type: RuntimeDefault}
          containers:
            - name: snapshot
              image: python:3.14.8-alpine3.24@sha256:f6a589d43c42b9e7f7dc67a12d37132491f362859a5d750607710cc56da3bc72
              command: [python3, /script/snapshot.py, /data]
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities: {drop: [ALL]}
              volumeMounts:
                - {name: data, mountPath: /data}
                - {name: script, mountPath: /script, readOnly: true}
              resources:
                requests: {cpu: 10m, memory: 16Mi}
                limits: {memory: 64Mi}
          volumes:
            - name: data
              persistentVolumeClaim: {claimName: linkding-data}
            - name: script
              configMap: {name: sqlite-snapshot}
