apiVersion: apps/v1
kind: Deployment
metadata:
  name: glance
spec:
  replicas: 1
  selector:
    matchLabels: {app: glance}
  template:
    metadata:
      labels: {app: glance}
    spec:
      enableServiceLinks: false
      securityContext:
        runAsUser: 65534            # nobody: Glance writes nothing
        runAsGroup: 65534
        runAsNonRoot: true
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: glance
          image: glanceapp/glance:v0.8.8@sha256:4d7445bc7971836858ffddee5d7501f1efbabb6e694a45b1dde1a789bb1943bb
          env:
            # Only used to build the links in glance.yml.
            - {name: NOOK_DOMAIN, value: home.dedyoc.com}
          ports: [{name: http, containerPort: 8080}]
          readinessProbe:
            httpGet: {path: /api/healthz, port: http}
            periodSeconds: 15
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
          volumeMounts:
            - {name: config, mountPath: /app/config, readOnly: true}
          resources:   # widget caches grow it a little over time
            requests: {cpu: 5m, memory: 32Mi}
            limits: {memory: 128Mi}
      volumes:
        - name: config
          configMap: {name: glance-config}
