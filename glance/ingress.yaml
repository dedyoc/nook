# The second rule has no host, so Glance also answers on any name without its own rule
# (the bare tailnet IP, the ts.net name). Rules with a host always win over it.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: glance
spec:
  ingressClassName: traefik
  rules:
    - host: home.dedyoc.com
      http:
        paths:
          - {path: /, pathType: Prefix, backend: {service: {name: glance, port: {name: http}}}}
    - http:
        paths:
          - {path: /, pathType: Prefix, backend: {service: {name: glance, port: {name: http}}}}
